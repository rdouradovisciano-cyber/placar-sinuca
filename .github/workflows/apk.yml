name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Testar a lógica pura
        run: npm test

      - name: Copiar o site para www
        run: |
          mkdir -p www
          cp index.html styles.css core.js app.js version.json manifest.webmanifest sw.js www/
          cp icon.svg icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png www/

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0d3b29' --iconBackgroundColorDark '#0d3b29' --splashBackgroundColor '#06120d' --splashBackgroundColorDark '#06120d' || echo "Aviso: não gerei os ícones do APK; seguindo com os padrões."
          npx cap sync android

      - name: Definir versionCode
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Configurar assinatura
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # a chave de debug é a do repositório: assim a versão nova instala por cima
          # da anterior sem desinstalar (e sem perder o histórico salvo no aparelho)
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
          cp signing/debug.keystore android/app/debug.keystore
          RELEASE=0
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            RELEASE=1
          else
            echo "Sem os 4 segredos de assinatura: usando a chave de debug do repositório."
          fi
          if ! python3 .github/scripts/signing-setup.py; then
            echo "Não consegui configurar a assinatura; voltando para debug."
            rm -f android/app/release.keystore
            python3 .github/scripts/signing-setup.py || exit 1
            RELEASE=0
          fi
          if [ "$RELEASE" = "1" ]; then
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew ${{ steps.sign.outputs.task }} --no-daemon

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: placar-sinuca-apk
          path: ${{ steps.sign.outputs.apk }}

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.sign.outputs.apk }}" placar-sinuca.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest placar-sinuca.apk \
            --title "Placar de Sinuca (build ${{ github.run_number }})" \
            --notes "APK para instalar no Android. O app roda offline e avisa quando houver versão nova (botão Verificar atualização na aba Backup)."
